name: Workflow Tarification Dynamique WooCommerce

on:
  schedule:
    # Exécution automatique tous les jours à 6h00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch: # Permet le lancement manuel depuis l'onglet Actions

jobs:
  mise-a-jour-prix:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v3

      - name: Configurer Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy gdown woocommerce requests

      - name: Exécuter la mise à jour dynamique des prix
        env:
          DRIVE_ID_MATRICE: ${{ secrets.DRIVE_ID_MATRICE }}
          URL_SITE: ${{ secrets.URL_SITE }}
          WOO_CONSUMER_KEY: ${{ secrets.WOO_CONSUMER_KEY }}
          WOO_CONSUMER_SECRET: ${{ secrets.WOO_CONSUMER_SECRET }}
        run: python dynamic_pricing.py
